mode: explore
project: "weijie_r3l"
group: "dapo_qwen25_1.5b_guidance_audit"
name: "DAPO_RFT_Qwen_1.5B_math_guidance_audit"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}
algorithm:
  algorithm_type: opmd_reweight_adv
  repeat_times: 2
model:
  model_path: /mnt/cpfs/shiweijie/hf_cache/qwen2.5-1.5b-ins
  max_response_tokens: 4096
  max_model_len: 20480
cluster:
  node_num: 1
  gpu_per_node: 4
buffer:
  # Oversample tasks because successful bases and invalid reflections do not
  # produce retry guidance; the audit script selects exactly 100 eligible rows.
  total_steps: 150
  batch_size: 1
  explorer_input:
    taskset:
      name: dapo-math-guidance-audit
      storage_type: file
      path: 'weijiezz/DAPO-Math-17k-split'
      split: 'test'
      format:
        prompt_key: 'prompt'
        response_key: 'reward_model'
      rollout_args:
        temperature: 0.0
        logprobs: 0
      workflow_args:
        save_experience_data: true
        data_dir: 'rebuttal/arr_may_emnlp/results/math_guidance_audit/raw'
    default_workflow_type: 'R3L_dapo_workflow'
  trainer_input:
    experience_buffer:
      name: dapo_math_guidance_audit_buffer
      storage_type: queue
      path: 'sqlite:///dapo_math_guidance_audit.db'
explorer:
  runner_per_model: 8
  rollout_model:
    engine_num: 4
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: false
    dtype: bfloat16
    seed: 2026
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
monitor:
  monitor_type: wandb
