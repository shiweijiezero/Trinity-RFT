project: "weijie_r3l"
group: "alfworld_qwen25_1.5b_kl_is_ablation"
name: "alfworld_qwen25_1.5b_r3l_no_kl_no_is_seed0"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}
algorithm:
  algorithm_type: r3l_no_kl_no_is
  policy_loss_fn: opmd
  kl_loss_fn: none
  repeat_times: 8
  optimizer:
    lr: 1e-6
model:
  model_path: /mnt/cpfs/shiweijie/hf_cache/qwen2.5-1.5b-ins
  max_response_tokens: 512
  max_model_len: 20480
cluster:
  node_num: 1
  gpu_per_node: 8
buffer:
  total_epochs: 20
  batch_size: 96
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: 'examples/R3L/alfworld/alfworld_data'
      split: 'train'
      format:
        prompt_key: 'task_id'
      rollout_args:
        temperature: 1.0
        logprobs: 0
    eval_tasksets:
      - name: alfworld-eval
        storage_type: file
        path: 'examples/R3L/alfworld/alfworld_data'
        split: 'test'
        format:
          prompt_key: 'task_id'
        rollout_args:
          temperature: 0.4
    default_workflow_type: 'R3L_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_r3l_no_kl_no_is_seed0_buffer
      storage_type: queue
      replay_buffer:
        enable: true
        priority_fn: decay_limit_randomization
      path: 'sqlite:///alfworld_r3l_no_kl_no_is_seed0.db'
explorer:
  runner_per_model: 32
  eval_interval: 20
  rollout_model:
    engine_num: 5
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: false
    dtype: bfloat16
    seed: 0
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
data_processor:
  experience_pipeline:
    operators:
      - name: "OPMD_filter"
synchronizer:
  sync_style: dynamic_by_explorer
  sync_method: 'nccl'
  sync_interval: 1
  sync_timeout: 12000
trainer:
  save_interval: 30
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 10240
  ulysses_sequence_parallel_size: 1
  trainer_config:
    trainer:
      max_actor_ckpt_to_keep: 1
      max_critic_ckpt_to_keep: 1
monitor:
  monitor_type: wandb
